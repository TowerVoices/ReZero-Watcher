name: ReZero Site Inspector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

# السماح بحفظ قاعدة البيانات في المستودع
permissions:
  contents: write

jobs:
  rezero-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Re:Zero Site Watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python rezero_site_watcher.py

      # حفظ قاعدة البيانات بعد الفحص
      - name: Commit and Push Database Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          git commit -m "Auto-update Re:Zero site database [skip ci]" || exit 0
          git push