name: Video Inspector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

# هذا القسم ضروري جداً للسماح للسكربت برفع وحفظ قاعدة البيانات في المستودع
permissions:
  contents: write

jobs:
  watcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create cookies.txt
        run: |
          cat > cookies.txt << 'EOF'
          ${{ secrets.YOUTUBE_COOKIES }}
          EOF

      - name: Run Watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python watcher.py

      # --- خطوة لحفظ قاعدة البيانات في جيتهاب ---
      - name: Commit and Push Database Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          git commit -m "Auto-update video database [skip ci]" || exit 0
          git push